name: Release

# Tag-driven release pipeline — ARCHITECTURE.md §35.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      # The updater key secret can pick up a stray trailing newline / CR when
      # it's set (web-UI paste, editors); Tauri's base64 decoder then rejects it
      # ("Invalid symbol 61" = the '=' padding no longer at the string end).
      # Re-export it with all whitespace stripped. The redirect keeps the value
      # out of the log, and GitHub still masks it.
      - name: Normalize the updater signing key
        shell: bash
        run: |
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$(printf '%s' "$SIGNING_KEY" | tr -d ' \t\r\n')" >> "$GITHUB_ENV"
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build, sign and publish the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY is set by the "Prepare signing key" step above.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public Supabase config baked into the client at build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # macOS ships unsigned (Gatekeeper: right-click -> Open the first time).
          # To notarize, add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # here and as repo secrets (RELEASE.md section 3). Do NOT add the env
          # lines while the secrets are empty -- tauri-action then tries (and
          # fails) to import an empty keychain certificate.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Grid Manager ${{ github.ref_name }}'
          releaseBody: |
            Personal project & task command center — cloud-backed, self-updating.

            ### Install
            | OS | Download | Notes |
            |----|----------|-------|
            | **Windows** | `*-setup.exe` (recommended) or `*.msi` | The installer bundles the WebView2 bootstrapper — nothing else to install. |
            | **macOS** | `*.dmg` | Apple-silicon + Intel universal. Not yet notarized: right-click the app → **Open** once, or allow it in System Settings → Privacy & Security. |
            | **Linux — Debian/Ubuntu** | `*.deb` | `sudo apt install ./Grid*.deb` (resolves dependencies). |
            | **Linux — Fedora/RHEL** | `*.rpm` | `sudo dnf install ./Grid*.rpm`. |
            | **Linux — other** | `*.AppImage` | `chmod +x` and run; no install needed. |

            Once installed, the app checks for updates on launch and updates itself.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
