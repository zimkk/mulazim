name: Release

# Tag-driven release pipeline — ARCHITECTURE.md §35.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    # Job-level so the Windows signing step can test for it in `if:`. The
    # `secrets` context is not available in a step-level `if`, and a step's own
    # `env:` is not visible to its own condition.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      # The updater key secret often picks up junk when it's set: a trailing
      # newline/CR, or the "%" end-of-line marker that zsh prints and a copy
      # grabs. Tauri's base64 decoder then throws "Invalid symbol N". Keep only
      # real base64 characters, then re-export. The redirect keeps the value out
      # of the log; GitHub still masks it.
      - name: Normalize the updater signing key
        shell: bash
        run: |
          clean=$(printf '%s' "$SIGNING_KEY" | tr -cd 'A-Za-z0-9+/=')
          echo "signing key length after cleanup: ${#clean}"
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$clean" >> "$GITHUB_ENV"
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Authenticode signing is what removes the "Unknown publisher" SmartScreen
      # warning on Windows. It needs a real code-signing certificate from a CA —
      # no configuration can substitute for it. When WINDOWS_CERTIFICATE is not
      # set this step does nothing and the build proceeds unsigned, exactly as
      # before. See RELEASE.md section 4.
      - name: Sign Windows binaries (skipped when no certificate is configured)
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          Write-Host "Signing as: $($cert.Subject)"
          # Tauri reads the thumbprint from tauri.conf.json, so inject it there.
          # Node rather than ConvertTo-Json: PowerShell rewrites the whole file
          # and mangles nested structures at depth.
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.windows.certificateThumbprint=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');" $cert.Thumbprint

      - name: Build, sign and publish the desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY is set by the "Prepare signing key" step above.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public Supabase config baked into the client at build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # macOS ships unsigned (Gatekeeper: right-click -> Open the first time).
          # To notarize, add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # here and as repo secrets (RELEASE.md section 3). Do NOT add the env
          # lines while the secrets are empty -- tauri-action then tries (and
          # fails) to import an empty keychain certificate.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mulazim ${{ github.ref_name }}'
          releaseBody: |
            Personal project & task command center — cloud-backed, self-updating.

            ### Install
            | OS | Download | Notes |
            |----|----------|-------|
            | **Windows** | `*-setup.exe` (recommended) or `*.msi` | Choose your language, install for just you (no admin) or for everyone, and pick the install folder. WebView2 is bundled — nothing else to install. |
            | **macOS** | `*.dmg` | Apple-silicon + Intel universal. Not yet notarized: right-click the app → **Open** once, or allow it in System Settings → Privacy & Security. |
            | **Linux — Debian/Ubuntu** | `*.deb` | `sudo apt install ./Mulazim*.deb` (resolves dependencies). |
            | **Linux — Fedora/RHEL** | `*.rpm` | `sudo dnf install ./Mulazim*.rpm`. |
            | **Linux — other** | `*.AppImage` | `chmod +x` and run; no install needed. |

            Once installed, the app checks for updates on launch and updates itself.

            > **Windows "Unknown publisher" warning:** these builds are not yet
            > Authenticode-signed, so SmartScreen will warn. Click **More info →
            > Run anyway**. Signing needs a paid code-signing certificate; see
            > `RELEASE.md` section 3.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
